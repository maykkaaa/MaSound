{% extends 'base.html' %}{% block title %}Upload music | YOUR SOUND{% endblock %}{% block content %}<section class="form-wrap"><div class="kicker">SHARE YOUR SOUND</div><h1>Upload a <em>track.</em></h1><form method="post" enctype="multipart/form-data" class="form-card">{% csrf_token %}<label>Track title<input name="title" required maxlength="160" placeholder="Give your track a name"></label><label>Audio file<input type="file" name="audio" accept="audio/*" required></label><label>Cover artwork <span class="muted">(optional)</span><input type="file" name="cover" accept="image/*"></label><label>Genre<input name="genre" placeholder="Electronic, Hip-hop, Indie..."></label><label>Description<textarea name="description" rows="4" placeholder="Tell listeners about your track"></textarea></label><button class="button">Publish track →</button></form></section>{% endblock %}
